name: StateGraph portable source contract (not guest evidence)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sg-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact revision and canonical StateGraph portability blobs
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          sh ci/verify-stategraph-portability.sh
      - name: Evidence boundary
        run: echo 'SOURCE_ONLY. No compiler parsing, native guest or backend parity claimed.'
