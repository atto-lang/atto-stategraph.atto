name: StateGraph source-only and integrity negatives
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD and all physical tracked source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          export EXPECTED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          sh ci/verify-exact-tree.sh
          sh ci/audit-source.sh
      - name: Six source-only full-tree tamper negatives
        shell: bash
        run: sh ci/test-tree-integrity.sh
      - name: Ensure a fake compiler does not pass native acceptance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export EXPECTED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          export ORESLANG_BIN=/usr/bin/true
          export ORESLANG_COMPILER_SHA256="$(sha256sum "$ORESLANG_BIN" | cut -d' ' -f1)"
          if sh ci/verify-supersteps-native.sh > /tmp/sg-fake-compiler-log 2>&1; then
            echo 'UNSAFE: fake compiler accepted' >&2
            exit 1
          fi
          grep -q 'missing compiler build_mode' /tmp/sg-fake-compiler-log
          echo 'HARNESS_NEGATIVE_PASS: /usr/bin/true rejected; no guest evidence'
      - name: Audit LLVM-specific AOT adapter (source-only)
        shell: bash
        run: |
          set -euo pipefail
          sh -n ci/verify-supersteps-llvm-aot.sh
          grep -q -- '--target=host' ci/verify-supersteps-llvm-aot.sh
          grep -q -- '-x ir' ci/verify-supersteps-llvm-aot.sh
          grep -q 'SG_LLVM_AOT_PASS' ci/verify-supersteps-llvm-aot.sh
          awk '/^  llvm-guest:/{llvm=1;next} /^  [a-z-]+:/{llvm=0} llvm{print}' \
            .github/workflows/supersteps-native.yml >/tmp/sg-llvm-supersteps-block
          grep -q 'sh ci/verify-supersteps-llvm-aot.sh' /tmp/sg-llvm-supersteps-block
          if grep -q 'sh ci/verify-supersteps-native.sh' /tmp/sg-llvm-supersteps-block; then
            echo 'LLVM job incorrectly invokes the direct Java guest runner' >&2
            exit 1
          fi
          awk '/^  native-llvm:/{llvm=1;next} /^  [a-z-]+:/{llvm=0} llvm{print}' \
            .github/workflows/native.yml >/tmp/sg-llvm-serial-block
          grep -q 'SG_NATIVE_SUITE: serial' /tmp/sg-llvm-serial-block
          grep -q 'sh ci/verify-supersteps-llvm-aot.sh' /tmp/sg-llvm-serial-block
          echo 'SG_LLVM_AOT_STATIC_POLICY_PASS (NOT a compiled guest)'
      - name: Fake LLVM compiler and Clang must never pass native acceptance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export EXPECTED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          export ORESLANG_LLVM_BIN=/usr/bin/true
          export SG_CLANG_BIN=/usr/bin/true
          export ORESLANG_COMPILER_SHA256="$(sha256sum /usr/bin/true | cut -d' ' -f1)"
          export SG_CLANG_SHA256="$ORESLANG_COMPILER_SHA256"
          unset SG_LLVM_RUNTIME_ARCHIVE SG_LLVM_RUNTIME_SHA256
          if sh ci/verify-supersteps-llvm-aot.sh > /tmp/sg-fake-llvm-log 2>&1; then
            echo 'UNSAFE: fake LLVM compiler accepted' >&2
            exit 1
          fi
          grep -q 'compiler emitted no native main definition' /tmp/sg-fake-llvm-log
          echo 'LLVM_AOT_HARNESS_NEGATIVE_PASS (source-only, not a guest test)'
      - name: Explicit evidence boundary
        run: echo 'SOURCE_ONLY_PASS is not native Oreslang compiler or runtime evidence.'
