name: StateGraph source-only guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source SHA and source contract (not a guest test)
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sh ci/audit-source.sh
      - name: Check tracked native source (not a guest test)
        shell: bash
        run: |
          set -euo pipefail
          for file in src/supersteps.ores tests/smoke.ores ci/verify-supersteps-native.sh README.md; do
            test -s "$file"
            test ! -L "$file"
            git ls-files --error-unmatch -- "$file" >/dev/null
          done
          grep -q 'define pub class SuperstepGraph<S>' src/supersteps.ores
          grep -q 'define pub class StatePatch<S>' src/supersteps.ores
          grep -q 'branch.choose(self.copy_state(candidate))' src/supersteps.ores
          grep -q 'SG_TYPED_SMOKE_PASS' tests/smoke.ores
          if grep -R -nE 'import +(java|javascript|python)|System\.exit|child_process|eval\(' src/; then
            echo 'Host execution dependency in native source' >&2
            exit 1
          fi
          echo 'SOURCE_ONLY_PASS: this does NOT establish compiler acceptance'
      - name: Native acceptance harness must reject fake zero-output compiler
        shell: bash
        run: |
          set -euo pipefail
          fake="/usr/bin/true"
          test -x "$fake"
          export EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          export EXPECTED_TREE_SHA="$(git rev-parse HEAD^{tree})"
          export ORESLANG_BIN="$fake"
          export ORESLANG_COMPILER_SHA256="$(sha256sum "$fake" | cut -d' ' -f1)"
          if sh ci/verify-supersteps-native.sh > /tmp/sg-fake-out 2>&1; then
            echo 'ERROR: fake zero-output compiler falsely accepted' >&2
            exit 1
          fi
          grep -q 'SG_SUPERSTEPS_NATIVE_NOT_ACCEPTED' /tmp/sg-fake-out
          echo 'HARNESS_NEGATIVE_TEST_PASS: fake compiler correctly rejected'
