name: Oreslang native StateGraph v0
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Source-only policy
        run: sh ci/audit-source.sh
      - name: Evidence boundary
        run: echo 'SOURCE_POLICY_ONLY - not native compilation or execution'
  native-graal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Java/Graal Oreslang guest execution
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_BIN: ${{ vars.ORESLANG_GRAAL_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_GRAAL_SHA256 }}
        run: sh ci/verify-native.sh
      - name: Execute six native Oreslang extended cases (Graal)
        shell: bash
        env:
          ORESLANG_BIN: ${{ vars.ORESLANG_GRAAL_BIN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          "$ORESLANG_BIN" --check tests/native-harness-extended.ores
          "$ORESLANG_BIN" tests/native-harness-extended.ores > "$RUNNER_TEMP/stategraph-harness.out"
          test "$(grep -c '^ORES_TEST|PASS|stategraph/extended/' "$RUNNER_TEMP/stategraph-harness.out")" -eq 6
          test "$(grep -c '^ORES_TEST|SUMMARY|' "$RUNNER_TEMP/stategraph-harness.out")" -eq 1
          grep -Fxq 'ORES_TEST|SUMMARY|total=6|passed=6|failed=0|skipped=0|filtered=0' "$RUNNER_TEMP/stategraph-harness.out"
  native-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned LLVM Oreslang guest execution
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_BIN: ${{ vars.ORESLANG_LLVM_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_LLVM_SHA256 }}
        run: sh ci/verify-native.sh
      - name: Execute six native Oreslang extended cases (LLVM)
        shell: bash
        env:
          ORESLANG_BIN: ${{ vars.ORESLANG_LLVM_BIN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          "$ORESLANG_BIN" --check tests/native-harness-extended.ores
          "$ORESLANG_BIN" tests/native-harness-extended.ores > "$RUNNER_TEMP/stategraph-harness.out"
          test "$(grep -c '^ORES_TEST|PASS|stategraph/extended/' "$RUNNER_TEMP/stategraph-harness.out")" -eq 6
          test "$(grep -c '^ORES_TEST|SUMMARY|' "$RUNNER_TEMP/stategraph-harness.out")" -eq 1
          grep -Fxq 'ORES_TEST|SUMMARY|total=6|passed=6|failed=0|skipped=0|filtered=0' "$RUNNER_TEMP/stategraph-harness.out"
