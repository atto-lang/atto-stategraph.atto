name: StateGraph supersteps - pinned native compiler
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graal-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute all four Oreslang superstep guests using pinned Java/Graal compiler
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_BIN: ${{ vars.ORESLANG_GRAAL_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_GRAAL_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          export EXPECTED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          sh ci/verify-supersteps-native.sh
  llvm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute all four Oreslang superstep guests using pinned LLVM compiler
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_BIN: ${{ vars.ORESLANG_LLVM_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_LLVM_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          export EXPECTED_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          sh ci/verify-supersteps-native.sh
