name: Oreslang typed SuperstepGraph native guests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersteps-native-graal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact tree pinned Graal native guests
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PINNED_SOURCE_TREE_SHA: ${{ vars.SG_EXPECTED_TREE_SHA }}
          ORESLANG_BIN: ${{ vars.ORESLANG_GRAAL_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_GRAAL_SHA256 }}
        run: |
          set -euo pipefail
          # GitHub's event SHA is an external identity of the checked-out
          # source commit; derive its exact tree from that pinned commit.
          tree="$(git rev-parse --verify "${EXPECTED_SOURCE_SHA}^{tree}")"
          if [ -n "$PINNED_SOURCE_TREE_SHA" ] && [ "$PINNED_SOURCE_TREE_SHA" != "$tree" ]; then
            echo 'NO_NATIVE_EVIDENCE: external source tree pin mismatched' >&2
            exit 1
          fi
          export EXPECTED_TREE_SHA="$tree"
          sh ci/verify-supersteps-native.sh
  supersteps-native-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact tree pinned LLVM native guests
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PINNED_SOURCE_TREE_SHA: ${{ vars.SG_EXPECTED_TREE_SHA }}
          ORESLANG_BIN: ${{ vars.ORESLANG_LLVM_BIN }}
          ORESLANG_COMPILER_SHA256: ${{ vars.ORESLANG_LLVM_SHA256 }}
        run: |
          set -euo pipefail
          # GitHub's event SHA is an external identity of the checked-out
          # source commit; derive its exact tree from that pinned commit.
          tree="$(git rev-parse --verify "${EXPECTED_SOURCE_SHA}^{tree}")"
          if [ -n "$PINNED_SOURCE_TREE_SHA" ] && [ "$PINNED_SOURCE_TREE_SHA" != "$tree" ]; then
            echo 'NO_NATIVE_EVIDENCE: external source tree pin mismatched' >&2
            exit 1
          fi
          export EXPECTED_TREE_SHA="$tree"
          sh ci/verify-supersteps-native.sh
